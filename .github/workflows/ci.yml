# CI: checks the manifests on every pull request into main, and again after
# a merge. Argo CD syncs main into the cluster automatically, so a broken
# manifest must be caught before it gets there.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the code, so give the token read-only access.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned version and checksum: the binary is checked before it runs.
      KUBECONFORM_VERSION: 0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Schemas for custom resources such as Argo CD's Application, from the
      # datreeio/CRDs-catalog repo, pinned to one commit so CI results don't
      # change on their own.
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/27233a506de0085e71c7f9702597806a7f95eb24/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        # Checks every YAML file in apps/ and bootstrap/ against its schema:
        # built-in Kubernetes kinds use the default schemas, and Argo CD
        # Applications use CRD_SCHEMAS. -strict rejects unknown fields, so a
        # typo like "syncPolicyy" fails here instead of being silently
        # ignored by the cluster.
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$CRD_SCHEMAS" \
            apps/ bootstrap/
