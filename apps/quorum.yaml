# Deploys quorum-server from the Helm chart in the quorum repo
# (charts/quorum) into the "quorum" namespace.
#
# The image (quorum-server:dev) isn't in a registry yet. Build it and load it
# into k3d first, from the quorum repo:
#   docker build -t quorum-server:dev . && k3d image import quorum-server:dev -c quorum
# Until then, the pods show ErrImagePull, and they start once the image is
# there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quorum # also the Helm release name, so the pods are quorum-0..2
  namespace: argocd
  # When this Application is deleted, Argo CD deletes what it deployed too.
  # The PersistentVolumeClaims stay: the StatefulSet created them, not Argo
  # CD, so Raft data is never deleted by accident.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/momoElbn/quorum
    # Our own chart, read straight from Git. It tracks main while the chart
    # is under development. To pin it, use a Git tag or commit SHA here.
    targetRevision: main
    path: charts/quorum
  destination:
    server: https://kubernetes.default.svc
    namespace: quorum
  syncPolicy:
    automated:
      prune: true # delete objects that were removed from the chart
      selfHeal: true # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
