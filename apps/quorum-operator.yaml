# Installs the quorum operator: the QuorumCluster CRD, the operator
# Deployment and its RBAC, from charts/quorum-operator in the quorum repo.
#
# The image comes from ghcr.io/momoelbn/quorum-operator once the quorum
# repo's CI has deployed for the first time. Until then it's the local
# quorum-operator:dev image imported into k3d.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quorum-operator
  namespace: argocd
  # Deleting this Application deletes what it deployed, including the CRD,
  # which deletes every QuorumCluster with it (their PVCs stay).
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/momoElbn/quorum
    # The quorum repo's CI pipeline sets targetRevision and the image tag
    # below to the commit it just built, after every merge to main. Chart,
    # CRD and operator image then always come from that same commit.
    targetRevision: f4f56b4ebcc0476e2f2552b07eab52ec63491110
    path: charts/quorum-operator
    helm:
      valuesObject:
        image:
          repository: ghcr.io/momoelbn/quorum-operator
          tag: f4f56b4ebcc0476e2f2552b07eab52ec63491110
  destination:
    server: https://kubernetes.default.svc
    namespace: quorum-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
