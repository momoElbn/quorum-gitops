# The quorum-server cluster, described as a QuorumCluster. The operator turns
# it into a StatefulSet (pods quorum-0..2), Services and a PodDisruptionBudget.
#
# The name "quorum" matters: the old Helm release used the same names, so
# the new StatefulSet picks up the existing volumes (data-quorum-0..2) and
# the Raft data in them.
apiVersion: quorum.momoelbn.github.io/v1alpha1
kind: QuorumCluster
metadata:
  name: quorum
spec:
  replicas: 3 # can't be changed after creation yet
  # Set by the quorum repo's CI after every merge to main, to
  # ghcr.io/momoelbn/quorum-server:<commit SHA>. Changing it rolls the pods
  # one at a time.
  image: ghcr.io/momoelbn/quorum-server:4b57d9f2c8afc47f66454c8fe31b5d9784331aa2
  storageSize: 1Gi # can't be changed after creation
